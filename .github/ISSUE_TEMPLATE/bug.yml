name: Bug report
description: Report reproducible incorrect behavior
title: "bug: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: Please remove secrets and personal data from logs or event payloads.
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include the expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Commands, project policy, and scrubbed events that reproduce the issue.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Veriplane revision
      placeholder: commit SHA or version
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        [
          Evidence engine,
          Project graph,
          Connector,
          Provider,
          API,
          Dashboard,
          Documentation,
        ]
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues.
          required: true
        - label: I removed credentials and personal data.
          required: true
